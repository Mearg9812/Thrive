<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <style>
    /* Light Mode: Dark Navy 'T' + Exact Logo Cyan Arrow */
    .t-shape {
      fill: #0e1b2a;
      transition: fill 0.3s ease;
    }
    .arrow-shape {
      fill: #1caaf5;
    }

    /* Dark Mode: Pure White 'T' (Exact to your PNG) + Cyan Arrow */
    @media (prefers-color-scheme: dark) {
      .t-shape {
        fill: #ffffff;
      }
      .arrow-shape {
        fill: #1caaf5;
      }
    }
  </style>

  <g>
    <!-- Top Bar & Upper Stem of 'T' -->
    <path class="t-shape" d="M 256,328 L 572,328 L 522,428 L 468,428 L 432,495 L 358,532 L 306,428 L 236,428 Z" />

    <!-- Lower Stem of 'T' -->
    <path class="t-shape" d="M 326,592 L 498,510 L 404,784 L 284,784 Z" />

    <!-- Exact Upward Lightning Arrow -->
    <path class="arrow-shape" d="M 193,846 L 712,305 L 762,382 L 821,150 L 586,214 L 646,281 L 440,480 L 453,518 L 433,508 Z" />
  </g>
</svg>